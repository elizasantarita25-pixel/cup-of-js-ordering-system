
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | Cup of J's</title>
</head>
<body>

    <h1>Change Password</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p class="{{ category }}">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <p>Welcome, {{ session.full_name }}!</p>

    <p>
        <a href="{{ url_for('customer_profile') }}">My Profile</a>
        |
        <a href="{{ url_for('customer_dashboard') }}">Dashboard</a>
    </p>

    <hr>

    <h2>Update Your Password</h2>

    <form method="POST" action="{{ url_for('customer_change_password') }}">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <p>
            <label for="current_password">Current Password:</label><br>
            <input
                type="password"
                id="current_password"
                name="current_password"
                required
            >
        </p>

        <p>
            <label for="new_password">New Password:</label><br>
            <input
                type="password"
                id="new_password"
                name="new_password"
                minlength="8"
                required
            >
        </p>

        <p>
            <label for="confirm_password">Confirm New Password:</label><br>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                minlength="8"
                required
            >
        </p>

        <button type="submit">Change Password</button>

    </form>

    <hr>

    <p>
        <a href="{{ url_for('customer_profile') }}">Back to My Profile</a>
    </p>

</body>
</html>
